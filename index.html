<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Founders Toolkit</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="header">
        <h1>AI Founders Toolkit</h1>
        <p class="subtitle">Start to collect feedback on my problem.</p>
      </header>

      <nav class="tabs">
        <button class="tab-button active" data-tab="feedback">Feedback Form</button>
        <button class="tab-button" data-tab="stakeholder">Stakeholder Tracker</button>
      </nav>

      <main class="content">
        <section class="tab-content active" id="feedback-tab">
          <section class="panel form-panel">
          <form id="feedbackForm">
            <div class="field-group">
              <label for="problem">What business problem are you trying to solve?</label>
              <textarea
                id="problem"
                name="problem"
                rows="6"
                placeholder="Describe the problem you want to tackle..."
                required
              ></textarea>
            </div>

            <div class="stakeholder-block">
              <h2>Stakeholder 1</h2>

              <div class="field-group">
                <label for="stakeholder1Resonate">Does this problem resonate with them?</label>
                <textarea id="stakeholder1Resonate" rows="3" required></textarea>
              </div>

              <div class="field-group">
                <label for="stakeholder1Matter">What aspects do they think matter most?</label>
                <textarea id="stakeholder1Matter" rows="3" required></textarea>
              </div>

              <div class="field-group">
                <label for="stakeholder1Questions">What questions or concerns come to mind?</label>
                <textarea id="stakeholder1Questions" rows="3" required></textarea>
              </div>

              <div class="field-group">
                <label for="stakeholder1Missing">What are you missing about this problem?</label>
                <textarea id="stakeholder1Missing" rows="3" required></textarea>
              </div>
            </div>

            <div class="stakeholder-block">
              <h2>Stakeholder 2</h2>

              <div class="field-group">
                <label for="stakeholder2Resonate">Does this problem resonate with them?</label>
                <textarea id="stakeholder2Resonate" rows="3" required></textarea>
              </div>

              <div class="field-group">
                <label for="stakeholder2Matter">What aspects do they think matter most?</label>
                <textarea id="stakeholder2Matter" rows="3" required></textarea>
              </div>

              <div class="field-group">
                <label for="stakeholder2Questions">What questions or concerns come to mind?</label>
                <textarea id="stakeholder2Questions" rows="3" required></textarea>
              </div>

              <div class="field-group">
                <label for="stakeholder2Missing">What are you missing about this problem?</label>
                <textarea id="stakeholder2Missing" rows="3" required></textarea>
              </div>
            </div>

            <button type="submit">Save Problem and Feedback</button>
          </form>
        </section>

        <section class="panel records-panel" aria-live="polite">
          <h2>Saved Problem and Feedback</h2>
          <div id="recordsList" class="records-list empty-state">
            <p>No saved records yet.</p>
          </div>
        </section>
        </section>

        <section class="tab-content" id="stakeholder-tab">
          <section class="panel form-panel">
            <h2>Stakeholder Tracker</h2>
            <p class="subtitle">Manage your interview research</p>

            <form id="stakeholderForm">
              <div class="field-group">
                <label for="stakeholderName">Name</label>
                <input
                  id="stakeholderName"
                  name="name"
                  type="text"
                  placeholder="Stakeholder name..."
                  required
                />
              </div>

              <div class="field-group">
                <label for="stakeholderType">Type</label>
                <select id="stakeholderType" name="type" required>
                  <option value="">Select type...</option>
                  <option value="interview">Interview</option>
                  <option value="survey">Survey</option>
                  <option value="email">Email</option>
                  <option value="text">Text</option>
                </select>
              </div>

              <div class="field-group">
                <label for="stakeholderFeedback">Key Feedback</label>
                <textarea
                  id="stakeholderFeedback"
                  name="feedback"
                  rows="6"
                  placeholder="Insights, concerns raised, what resonated..."
                  required
                ></textarea>
              </div>

              <button type="submit">Add Stakeholder</button>
            </form>
          </section>

          <section class="panel records-panel" aria-live="polite">
            <h2>Stakeholder Records</h2>
            <div id="stakeholdersList" class="table-container">
              <table class="stakeholders-table">
                <thead>
                  <tr>
                    <th>Name</th>
                    <th>Type</th>
                    <th>Key Feedback</th>
                  </tr>
                </thead>
                <tbody>
                  <tr class="empty-row">
                    <td colspan="3">No stakeholder records yet.</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </section>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
