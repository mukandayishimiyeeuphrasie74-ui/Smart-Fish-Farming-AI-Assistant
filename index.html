<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Founders Toolkit</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="header">
        <h1>AI Founders Toolkit</h1>
        <p class="subtitle">Start to collect feedback on my problem.</p>
      </header>

      <main class="content">
        <section class="panel form-panel">
          <form id="feedbackForm">
            <div class="field-group">
              <label for="problem">What business problem are you trying to solve?</label>
              <textarea
                id="problem"
                name="problem"
                rows="6"
                placeholder="Describe the problem you want to tackle..."
                required
              ></textarea>
            </div>

            <div class="stakeholder-block">
              <h2>Stakeholder 1</h2>

              <div class="field-group">
                <label for="stakeholder1Resonate">Does this problem resonate with them?</label>
                <textarea id="stakeholder1Resonate" rows="3" required></textarea>
              </div>

              <div class="field-group">
                <label for="stakeholder1Matter">What aspects do they think matter most?</label>
                <textarea id="stakeholder1Matter" rows="3" required></textarea>
              </div>

              <div class="field-group">
                <label for="stakeholder1Questions">What questions or concerns come to mind?</label>
                <textarea id="stakeholder1Questions" rows="3" required></textarea>
              </div>

              <div class="field-group">
                <label for="stakeholder1Missing">What are you missing about this problem?</label>
                <textarea id="stakeholder1Missing" rows="3" required></textarea>
              </div>
            </div>

            <div class="stakeholder-block">
              <h2>Stakeholder 2</h2>

              <div class="field-group">
                <label for="stakeholder2Resonate">Does this problem resonate with them?</label>
                <textarea id="stakeholder2Resonate" rows="3" required></textarea>
              </div>

              <div class="field-group">
                <label for="stakeholder2Matter">What aspects do they think matter most?</label>
                <textarea id="stakeholder2Matter" rows="3" required></textarea>
              </div>

              <div class="field-group">
                <label for="stakeholder2Questions">What questions or concerns come to mind?</label>
                <textarea id="stakeholder2Questions" rows="3" required></textarea>
              </div>

              <div class="field-group">
                <label for="stakeholder2Missing">What are you missing about this problem?</label>
                <textarea id="stakeholder2Missing" rows="3" required></textarea>
              </div>
            </div>

            <button type="submit">Save Problem and Feedback</button>
          </form>
        </section>

        <section class="panel records-panel" aria-live="polite">
          <h2>Saved Problem and Feedback</h2>
          <div id="recordsList" class="records-list empty-state">
            <p>No saved records yet.</p>
          </div>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
